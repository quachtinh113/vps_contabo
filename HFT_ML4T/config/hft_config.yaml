# =====================================================================
# HFT_ML4T — Production Configuration (Institutional Settings)
# =====================================================================

system:
  environment: "LIVE"
  polling_interval_seconds: 2.0    # Real-time scan interval (seconds)
  log_level: "INFO"
  log_dir: "logs"

risk_desk:
  max_daily_drawdown_usd: 300.0    # Hard halt if daily loss reaches $300
  max_daily_drawdown_pct: 0.05     # 5.0% maximum daily drawdown
  warning_drawdown_pct: 0.025      # 2.5% warning trigger
  min_margin_level_percent: 300.0  # Stop trading if margin level drops below 300%
  max_total_open_positions: 6      # Global concurrent position limit across all assets
  max_positions_per_symbol: 1      # Max 1 concurrent position per asset
  rollover_curfew_utc: ["21:45", "22:30"]  # Exness daily rollover spread freeze
  post_sl_cooldown_seconds: 240    # Cooldown 4 phút sau khi dính SL để triệt tiêu Whipsaw
  
  # Nautilus Dynamic Profit Locking Ladder:
  enable_profit_ladder: true       # Thay thế Breakeven trap bằng Profit Locking Ladder
  profit_ladder:
    tier1_trigger_ratio: 0.50      # Khi lãi đạt 50% TP distance
    tier1_lock_ratio: 0.25         # Khóa +25% TP distance làm lợi nhuận chắc chắn
    tier2_trigger_ratio: 0.75      # Khi lãi đạt 75% TP distance
    tier2_lock_ratio: 0.50         # Khóa +50% TP distance
  max_holding_bars_m15: 16         # Nautilus Alpha Decay Time-Barrier (Tối đa 4 tiếng)

symbols:
  # ===================================================================
  # PILLAR 1: Sovereign Crypto Champion (Bitcoin) — Giảm tỷ trọng phòng thủ
  # ===================================================================
  - name: "BTCUSDm"
    enabled: true
    strategy_type: "crypto"
    magic: 777004
    timeframe: "M15"
    max_spread_points: 2500.0      # ~25 USD max spread cap (normal Exness spread is 600 - 1200 pts)
    sl_multiplier: 1.5
    tp_multiplier: 3.2             # Tỷ lệ R:R 1:2.13
    position_sizing:
      risk_per_trade_pct: 0.003    # Giảm từ 0.5% xuống 0.3% để hạn chế drawdown
      max_lot_cap: 0.05            # Giảm từ 0.10 xuống 0.05 BTC
    avellaneda_stoikov:
      gamma: 0.10
      kappa: 1.5
      ofi_sensitivity: 0.25

  # ===================================================================
  # PILLAR 2: Precious Metal Champion (Gold) — Duy trì chuẩn thể chế
  # ===================================================================
  - name: "XAUUSDm"
    enabled: true
    strategy_type: "gold"
    magic: 777001
    timeframe: "M15"
    max_spread_points: 350.0       # Max allowable spread in points (~35 pips / $0.35)
    sl_multiplier: 1.5
    tp_multiplier: 3.0             # Tỷ lệ R:R 1:2.0
    position_sizing:
      risk_per_trade_pct: 0.005    # Chuẩn 0.5% risk per trade
      max_lot_cap: 0.08            # Khống chế 0.08 lot an toàn
    avellaneda_stoikov:
      gamma: 0.10
      kappa: 1.5
      ofi_sensitivity: 0.25

  # ===================================================================
  # PILLAR 3: Commodity Energy Champion (Crude Oil WTI) — Tăng tải sinh lời (PF 1.01)
  # ===================================================================
  - name: "USOILm"
    enabled: true
    strategy_type: "oil"
    magic: 777005
    timeframe: "M15"
    max_spread_points: 35.0        # Max allowable spread in points (~0.035$, normal spread is 20 pts)
    sl_multiplier: 1.5
    tp_multiplier: 3.0             # Tỷ lệ R:R 1:2.0 (Win rate 61.3%)
    position_sizing:
      risk_per_trade_pct: 0.007    # Tăng từ 0.5% lên 0.7% vốn để tối đa hóa lợi nhuận
      max_lot_cap: 0.12            # Tăng từ 0.08 lên 0.12 lot (120 thùng)
    avellaneda_stoikov:
      gamma: 0.12
      kappa: 1.8
      ofi_sensitivity: 0.25

  # ===================================================================
  # PILLAR 4: US Equity Index Champion (Dow Jones 30) — Tăng tỷ trọng ổn định (PF 0.96)
  # ===================================================================
  - name: "US30m"
    enabled: true
    strategy_type: "index"
    magic: 777006
    timeframe: "M15"
    max_spread_points: 25.0        # Max allowable spread in points (~2.5$, normal spread is 10 pts)
    trading_session_utc: ["13:00", "21:00"] # Session Filter: Chỉ áp dụng riêng cho US30m (Phiên Mỹ New York)
    sl_multiplier: 1.5
    tp_multiplier: 2.8             # Tỷ lệ R:R 1:1.87 (Win rate 55.4%)
    position_sizing:
      risk_per_trade_pct: 0.006    # Tăng từ 0.5% lên 0.6% vốn (Max DD chỉ $104)
      max_lot_cap: 0.25            # Tăng từ 0.20 lên 0.25 lot
    avellaneda_stoikov:
      gamma: 0.10
      kappa: 1.6
      ofi_sensitivity: 0.25

  # ===================================================================
  # DEFENSIVE ALLOCATION: Major Forex Pairs (Tạm dừng để triệt tiêu hao mòn spread)
  # ===================================================================
  - name: "EURUSDm"
    enabled: false                 # Tạm tắt để triệt tiêu hao mòn spread M15
    strategy_type: "fx"
    magic: 777003
    timeframe: "M15"
    max_spread_points: 15.0
    sl_multiplier: 1.3
    tp_multiplier: 2.5
    position_sizing:
      risk_per_trade_pct: 0.005
      max_lot_cap: 0.10
    avellaneda_stoikov:
      gamma: 0.10
      kappa: 2.0
      ofi_sensitivity: 0.25

  - name: "GBPUSDm"
    enabled: false                 # Tạm tắt để triệt tiêu hao mòn spread M15
    strategy_type: "fx"
    magic: 777002
    timeframe: "M15"
    max_spread_points: 18.0
    sl_multiplier: 1.3
    tp_multiplier: 2.5
    position_sizing:
      risk_per_trade_pct: 0.005
      max_lot_cap: 0.10
    avellaneda_stoikov:
      gamma: 0.10
      kappa: 2.0
      ofi_sensitivity: 0.25
