# =====================================================================
# HFT_ML4T — Production Configuration (Institutional Settings)
# =====================================================================

system:
  environment: "LIVE"
  polling_interval_seconds: 2.0    # Real-time scan interval (seconds)
  log_level: "INFO"
  log_dir: "logs"

risk_desk:
  max_daily_drawdown_usd: 100.0    # Institutional Circuit Breaker: Hard halt if daily loss reaches -$100 (1.0% Equity)
  max_daily_drawdown_pct: 0.02     # 2.0% maximum daily drawdown
  hard_daily_target_usd: 200.0     # Baseline Hard Daily Target
  weekly_baseline_target_usd: 1000.0 # $1,000/week baseline target
  weekday_targets_usd:
    0: 150.0  # Monday ($150)
    1: 200.0  # Tuesday ($200)
    2: 200.0  # Wednesday ($200)
    3: 280.0  # Thursday ($280)
    4: 170.0  # Friday ($170)
  sessions:
    asia:
      window_utc: ["00:00", "07:00"]
      quota_pct: 0.20              # 20% quota ($40 on $200 day)
      sub_stop_usd: 35.0           # -$35.00 session sub-stop
      xau_lot_multiplier: 0.50     # 0.25% risk per trade in Asia
      allowed_symbols: ["XAUUSDm"] # USOILm strictly disabled
    london:
      window_utc: ["07:00", "13:00"]
      quota_pct: 0.35              # 35% quota ($70 on $200 day; cumulative $110 locks until US Open)
      cumulative_lock_ratio: 0.55  # Lock when cumulative daily PnL >= 55% of weekday target
      allowed_symbols: ["XAUUSDm"]
    us:
      window_utc: ["13:00", "20:00"]
      quota_pct: 0.45              # 45% quota ($90 on $200 day)
      allowed_symbols: ["XAUUSDm", "USOILm"]
      fat_tail_window_utc: ["13:00", "17:00"]
  friday_hard_flat_utc: "13:00"    # Friday 13:00 UTC (20:00 VN) Hard Flat Invariant
  fat_tail_override_enabled: true  # Fat-Tail Mode: Override $200 lock ONLY during US Session if OBI >= 0.85 & Vol >= 3x
  fat_tail_min_ofi: 0.85           # Extreme OBI threshold for Fat-Tail Conviction
  fat_tail_min_vol_mult: 3.0       # Volume >= 3x SMA20
  fat_tail_session_utc: ["13:00", "17:00"] # Peak US Liquidity Window
  stagnation_timeout_minutes: 45   # Trailing-Tighten Time-Barrier: 45m stagnation (3 M15 bars)
  warning_drawdown_pct: 0.015      # 1.5% warning trigger
  min_margin_level_percent: 300.0  # Stop trading if margin level drops below 300%
  max_total_open_positions: 4      # Focused capacity on champion assets
  max_positions_per_symbol: 1      # Max 1 concurrent position per asset
  rollover_curfew_utc: ["21:45", "22:30"]  # Exness daily rollover spread freeze
  macro_news_window_utc: ["14:15", "14:45"] # Lá chắn tin vĩ mô 14:30 UTC: Chặn mở lệnh mới trên USD-sensitive assets
  macro_news_symbols: ["XAUUSDm", "US30m", "USOILm", "GBPUSDm"]
  post_sl_cooldown_seconds: 300    # Base Cooldown (5 phút)
  max_daily_loss_per_symbol_usd: 80.0      # Hạn mức chịu lỗ tối đa cho từng Symbol ($80/ngày)
  consecutive_loss_cooldowns: [300, 2700, -1] # Cooldown lũy tiến: 5m -> 45m -> Khóa symbol hết ngày
  max_trailing_drawdown_pct: 0.08          # 8.0% All-time High-Water Mark Trailing Drawdown Guard
  max_positions_per_cluster: 2             # Tối đa 2 vị thế mở cùng 1 nhóm tài sản (Metals, Crypto, FX...)
  auto_write_halt_file: true               # Tự động ghi file HALT_HFT vật lý khi chạm Circuit Breaker
  
  # Tier 3: Matrix Risk & Pod Drawdown Recovery (3 consecutive losses -> 24h lockout + 50% recovery sizing)
  pod_drawdown:
    enabled: true
    consecutive_loss_threshold: 3 # Chuỗi 3 lệnh thua liên tiếp
    lockout_duration_hours: 24.0  # Tạm dừng giao dịch cặp đó 24 giờ để bão hòa vùng nhiễu
    recovery_trades_count: 5      # 5 lệnh tiếp theo trong chế độ phục hồi
    recovery_lot_multiplier: 0.50 # Giảm 50% volume (0.5x lot) trong 5 lệnh phục hồi

  # Tier 1: Dynamic ATR Trailing Stop & Expectancy Engine
  trailing_stop:
    enabled: true
    mode: "atr_dynamic"           # ATR-based Dynamic Trailing Stop
    atr_multiplier: 1.5           # Biên độ đệm 1.5x ATR
    min_gain_ratio: 0.60          # Kích hoạt khi lãi đạt 60% TP distance hoặc 1.5x ATR
    guarantee_breakeven: true     # Không bao giờ kéo SL dưới điểm hòa vốn + phí spread

  # Nautilus Dynamic Profit Locking Ladder (Legacy Fallback):
  enable_profit_ladder: true       # Dự phòng bậc thang
  profit_ladder:
    tier1_trigger_ratio: 0.50      # Khi lãi đạt 50% TP distance
    tier1_lock_ratio: 0.25         # Khóa +25% TP distance làm lợi nhuận chắc chắn
    tier2_trigger_ratio: 0.75      # Khi lãi đạt 75% TP distance
    tier2_lock_ratio: 0.50         # Khóa +50% TP distance
  max_holding_bars_m15: 3          # 45m Empirical Stagnation Horizon (3 M15 bars, empirical WR peaks at 52.6%)

symbols:
  # ===================================================================
  # PILLAR 1: Sovereign Crypto Champion (Bitcoin) — Khử nhiễu Order Flow ban đêm & Đa khung
  # ===================================================================
  - name: "BTCUSDm"
    enabled: false                 # DISABLED: High slippage, thin Asian liquidity sweep traps (-$97.45)
    strategy_type: "crypto"
    magic: 777004
    timeframe: "M15"
    trading_session_utc: ["12:00", "22:00"] # Khóa phiên Á (00:00-12:00 UTC) thanh khoản mỏng, chỉ giao dịch phiên Âu-Mỹ
    max_spread_to_atr_ratio: 0.12           # Chặn vào lệnh khi spread vượt quá 12% ATR14 M15 (tránh quét râu SL)
    max_spread_points: 2500.0      # ~25 USD max spread cap (normal Exness spread is 600 - 1200 pts)
    sl_multiplier: 1.5
    tp_multiplier: 3.2             # Tỷ lệ R:R 1:2.13
    position_sizing:
      risk_per_trade_pct: 0.003    # Giảm từ 0.5% xuống 0.3% để hạn chế drawdown
      max_lot_cap: 0.05            # Giảm từ 0.10 xuống 0.05 BTC
    avellaneda_stoikov:
      gamma: 0.03                  # CPCV Validated (5.3% Divergence)
      kappa: 0.8
      ofi_sensitivity: 0.30
      ofi_threshold: 0.30          # CPCV Validated threshold
      ofi_night_threshold: 0.35    # Ngưỡng OFI ban đêm
    volume_filter:
      enabled: true
      sma_period: 20               # Volume >= 0.9 * SMA(Volume, 20)
      min_multiplier: 0.9          # Nới lỏng từ 1.2 xuống 0.9 chống nghẽn lệnh
    night_window_utc: ["20:00", "02:00"] # Khung giờ thanh khoản mỏng ban đêm
    multi_tf_consensus:
      enabled: true                # Tier 2: Chỉ vào lệnh khi H1 và H4 đồng thuận xu hướng
      h1_ema_fast: 50
      h1_ema_slow: 200
    profit_ladder:
      tier1_trigger_ratio: 0.65    # Nới lỏng từ 50% lên 65% TP chống rung lắc quét SL non
      tier1_lock_ratio: 0.25
      tier2_trigger_ratio: 0.85
      tier2_lock_ratio: 0.50

  # ===================================================================
  # PILLAR 2: Precious Metal Champion (Gold) — Phiên Âu/Mỹ & Session-Aware ATR
  # ===================================================================
  - name: "XAUUSDm"
    enabled: true                  # CHAMPION ASSET: Net +$302.11, PF 2.13, WR 53.3%
    strategy_type: "gold"
    magic: 777001
    timeframe: "M15"
    max_spread_points: 350.0       # Max allowable spread in points (~35 pips / $0.35)
    trading_session_utc: ["07:00", "21:00"] # Phiên Âu - Mỹ (07:00 - 21:00 UTC)
    asian_range_window_utc: ["00:00", "07:00"] # Khung quét biên Á để săn thanh khoản
    sl_multiplier: 1.5
    tp_multiplier: 3.5             # Nâng R:R lên 1:2.33 để tối ưu hóa kỳ vọng
    position_sizing:
      risk_per_trade_pct: 0.005    # Capped at exactly 0.5% Institutional Risk Per Trade
      max_lot_cap: 0.07            # Capped at 0.07 lot for baseline trades
      fat_tail_pyramid_lot: 0.02   # Micro-lot pyramid sizing in Fat-Tail Conviction Mode
    avellaneda_stoikov:
      gamma: 0.03                  # CPCV Validated (15.5% Divergence)
      kappa: 0.8
      ofi_sensitivity: 0.30
    session_aware_atr:
      enabled: true
      asia_europe_utc: ["07:00", "12:00"] # Đã giới hạn sau 07:00 UTC
      asia_europe_sl_mult: 1.5     # Phiên Âu: SL Multiplier = 1.5x ATR
      us_session_utc: ["12:00", "21:00"]
      us_session_sl_mult: 2.2      # Phiên Mỹ: SL Multiplier = 2.2x ATR
      tp_rr_ratio: 2.0             # Bảo toàn tỷ lệ TP/SL = 2.0 (Volatility Sizing Invariant)
    profit_ladder:
      tier1_trigger_ratio: 0.50    # Duy trì nguyên trạng chiến lược đã mang lại PnL dương
      tier1_lock_ratio: 0.25
      tier2_trigger_ratio: 0.75
      tier2_lock_ratio: 0.50

  # ===================================================================
  # PILLAR 3: Commodity Energy Champion (Crude Oil WTI) — Đồng thuận xu hướng đa khung
  # ===================================================================
  - name: "USOILm"
    enabled: true
    strategy_type: "oil"
    magic: 777005
    timeframe: "M15"
    max_spread_points: 35.0        # Max allowable spread in points (~0.035$, normal spread is 20 pts)
    trading_session_utc: ["07:00", "20:00"]  # Chặn phiên Á (00:00-05:00 UTC) thanh khoản mỏng
    friday_hard_close_utc: "20:30"           # Bắt buộc đóng toàn bộ lệnh trước khi đóng cửa tuần
    min_sl_distance_pct: 0.0035              # Sàn bảo vệ tối thiểu 0.35% giá đối với USOILm chống quét nhiễu < 15m
    sl_multiplier: 2.2             # Nới từ 1.5 lên 2.2 ATR14 (chống whipsaw khung 5-15m)
    tp_multiplier: 3.3             # Duy trì tỷ lệ R:R tối thiểu 1:1.5
    position_sizing:
      risk_per_trade_pct: 0.003    # Giảm từ 0.007 (0.7%) xuống 0.003 (0.3%)
      max_lot_cap: 0.05            # Hạ trần lot từ 0.12 xuống 0.05 lot để chặn lỗ $50-$65/lệnh
    avellaneda_stoikov:
      gamma: 0.03                  # CPCV Validated (28.1% Divergence)
      kappa: 0.8
      ofi_sensitivity: 0.30
    multi_tf_consensus:
      enabled: true                # Tier 2: Chỉ mở lệnh M15 khi xu hướng H1 và H4 đồng thuận
      h1_ema_fast: 50
      h1_ema_slow: 200
    profit_ladder:
      tier1_trigger_ratio: 0.65    # Nới lỏng từ 50% lên 65% TP chống rung lắc quét SL non
      tier1_lock_ratio: 0.25
      tier2_trigger_ratio: 0.85
      tier2_lock_ratio: 0.50

  # ===================================================================
  # PILLAR 4: US Equity Index Champion (Dow Jones 30) — H1 Trend & Pullback Filter
  # ===================================================================
  - name: "US30m"
    enabled: false                 # DISABLED: False breakout whipsaws (-$95.13)
    strategy_type: "index"
    magic: 777006
    timeframe: "M15"
    max_spread_points: 25.0        # Max allowable spread in points (~2.5$, normal spread is 10 pts)
    trading_session_utc: ["14:00", "20:30"] # US Cash Session Gate: Prevents outside-hours closed market attempts
    friday_hard_close_utc: "20:30"
    sl_multiplier: 1.5
    tp_multiplier: 2.8             # Tỷ lệ R:R 1:1.87 (Win rate 55.4%)
    position_sizing:
      risk_per_trade_pct: 0.005    # 0.5% vốn
      max_lot_cap: 0.15            # Hạ từ 0.25 xuống 0.15 lot phòng thủ phiên Mỹ
    avellaneda_stoikov:
      gamma: 0.03                  # CPCV Validated (9.1% Divergence)
      kappa: 0.8
      ofi_sensitivity: 0.35
    trend_filter:
      h1_ema_period: 50            # Close_H1 > EMA50_H1 or Close_H1 > DonchianMid_H1
      donchian_period: 20          # Chu kỳ Donchian Channel trên H1
      block_consecutive_impulse: 2 # Chặn bắt dao rơi khi nến M15 xả thẳng đứng
    profit_ladder:
      tier1_trigger_ratio: 0.50    # Duy trì nguyên trạng chiến lược (PF 1.78)
      tier1_lock_ratio: 0.25
      tier2_trigger_ratio: 0.75
      tier2_lock_ratio: 0.50

  # ===================================================================
  # PILLAR 5 & 6: Major Forex Pairs (Thanh khoản cao, spread siêu mỏng 6-12 pts)
  # ===================================================================
  - name: "EURUSDm"
    enabled: false                 # Tạm tắt theo khuyến nghị kiểm toán (loại bỏ cặp có kỳ vọng âm)
    strategy_type: "fx"
    magic: 777003
    timeframe: "M15"
    max_spread_points: 15.0
    sl_multiplier: 1.3
    tp_multiplier: 2.5
    position_sizing:
      risk_per_trade_pct: 0.005
      max_lot_cap: 0.10
    avellaneda_stoikov:
      gamma: 0.10
      kappa: 2.0
      ofi_sensitivity: 0.25

  - name: "GBPUSDm"
    enabled: false                 # Tạm ngưng do Sharpe 7d = -2.75, WR = 34.1% trong HIGH_VOL_MEAN_REVERTING
    strategy_type: "fx"
    magic: 777002
    timeframe: "M15"
    max_spread_points: 18.0
    sl_multiplier: 2.0             # Nới từ 1.3 lên 2.0 ATR14
    tp_multiplier: 3.0
    position_sizing:
      risk_per_trade_pct: 0.002    # Hạ dự phòng từ 0.005 xuống 0.002 (0.2%)
      max_lot_cap: 0.05
    avellaneda_stoikov:
      gamma: 0.10
      kappa: 2.0
      ofi_sensitivity: 0.25
